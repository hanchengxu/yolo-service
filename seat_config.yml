# seat-watcher 配置
#
# 所有坐标都是归一化 0~1，跟画面分辨率无关。
# ⚠️ 前提：摄像头机位固定（关闭移动追踪/自动巡航），否则坐标全废。

# ---------------- 抓帧来源 ----------------
source:
  # go2rtc 的快照接口，一次 GET 一张 JPEG
  url: "http://127.0.0.1:1984/api/frame.jpeg?src=dining"
  timeout: 5

# ---------------- 模型 ----------------
model:
  path: "yolov8s_openvino_model/" # 实测：0.882 / 83ms（iGPU）
  device: "intel:gpu" # intel:gpu = Intel 核显；不可用会自动回退 cpu
  imgsz: 640
  conf: 0.5 # 低于此置信度不计入

# ---------------- 座位判定区 ----------------
# 只认「框中心落在这个矩形内」的人 —— 相当于摄像头的 Activity Zone
zone:
  rect: [0.62, 0.44, 0.88, 0.84] # [x1, y1, x2, y2]
  # 框高占画面比例的上限：超过就认为「站着」而不是「坐着」
  # 实测坐姿 0.39、站姿约 0.68，取 0.5 中间值
  max_box_h_pct: 0.5

# ---------------- 去抖 ----------------
debounce:
  # 实际延迟 = 次数 × interval（秒）。两个数字故意不对称：
  #   进来要快（坐下即亮），出去要慢（防低头/转身/被挡导致状态闪断）
  hit_needed: 1 # 1×0.5s ≈ 0.5 秒确认「在座」，坐下即开灯
  miss_needed: 20 # 20×0.5s = 10 秒未检出才判定「离开」
  #   ⚠️ 别改小：低头捡东西 YOLO 会掉 1~2 秒，太小会导致灯闪断
  hold_minutes: 20 # 兜底强制释放（正常流程走不到这里）
  interval: 0.5 # 检测间隔（秒）；0.5 秒一次足够快，iGPU 占用很低

# ---------------- 日志 ----------------
# 服务器上主要靠它确认「服务活着、状态对不对」
logging:
  level: info # debug = 每帧明细（排障时用，正常别开）
  file: "logs/seat_watcher.log" # 相对脚本目录；留空 = 只打控制台
  max_bytes: 5242880 # 单文件 5MB，超出自动滚动
  backups: 3 # 保留 seat_watcher.log.1 ~ .3
  heartbeat_sec: 60 # 每 60 秒一行状态汇总；0 = 关闭

# ---------------- Home Assistant ----------------
ha:
  # 联调时设为 true；只想看日志就留 false
  enabled: true
  # 直接写这里，或留空改用环境变量 HA_TOKEN（令牌不进文件时）
  url: "http://192.168.1.117:8123"
  entity_id: "binary_sensor.dining_seat_occupied"  # 仍会更新这个「事实」实体
  token: ""
  entity_id: "binary_sensor.dining_seat_occupied"
